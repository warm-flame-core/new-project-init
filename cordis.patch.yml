# new-project-init bundle patch: register the packaged skill provider into the
# host skill registry (its rows are host-plane, so every agent preset's scope
# chain merges the skill it registers).
#
# This patch is applied over the dsh-base layer; later layers (the profile's
# own cordis.patch.yml and --patch overlays) can still address this row by id.
- insert:
    - id: new-project-init
      name: 'new-project-init'
